<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a263a">
<title>食樂商行｜商品目錄</title>
<style>
:root{--wine:#7a263a;--deep:#5b1d2d;--soft:#f5e9ec;--line:#eadde0;--bg:#faf8f8}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:#222}
header{position:sticky;top:0;z-index:30;background:var(--wine);color:#fff;padding:15px 14px 12px;box-shadow:0 2px 10px #0002}
h1{font-size:21px;text-align:center;margin:0 0 10px}.search{width:100%;border:0;border-radius:14px;padding:12px 14px;font-size:16px;outline:none}
.nav{position:sticky;top:104px;z-index:20;background:#fff;padding:10px 12px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.tab{white-space:nowrap;border:1px solid #d9bfc6;background:#fff;color:var(--deep);border-radius:999px;padding:8px 13px;font-size:15px}.tab.on{background:var(--wine);color:#fff;border-color:var(--wine)}
main{max-width:760px;margin:auto;padding:12px 12px 80px}.sec{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 10px #5b1d2d0c}
.sec h2{margin:0;padding:13px 15px;background:var(--soft);color:var(--deep);font-size:19px}.item{padding:13px 16px;border-top:1px solid var(--line);font-size:17px;font-weight:600}
.msg{text-align:center;color:#777;padding:55px 15px;line-height:1.7}.count{text-align:center;font-size:12px;margin-top:7px;color:#f3dce2}
</style>
</head>
<body>
<header><h1>食樂商行｜商品目錄</h1><input id="q" class="search" type="search" placeholder="搜尋商品名稱…"><div id="count" class="count">載入商品中…</div></header>
<div class="nav"><div id="tabs" class="tabs"></div></div>
<main id="list"><div class="msg">正在讀取最新商品資料…</div></main>
<script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vREtkAeSFqvmGLgIShhstyRWspXE0bmaoiVmKR9dAhj39rDuLLCdrP4FBGZ2MTN9OZ1mfJn7Heg9OZQ/pub?gid=1340734236&single=true&output=csv";
let DATA=[],cat="全部";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
function parseCSV(t){
 let rows=[],row=[],cell="",q=false;
 for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];
  if(q){if(c=='"'&&n=='"'){cell+='"';i++}else if(c=='"'){q=false}else cell+=c}
  else if(c=='"'){q=true}else if(c==','){row.push(cell);cell=""}
  else if(c=='\n'){row.push(cell.replace(/\r$/,""));rows.push(row);row=[];cell=""}
  else cell+=c
 }
 if(cell.length||row.length){row.push(cell);rows.push(row)} return rows;
}
function build(rows){
 const h=rows[0].map(x=>x.trim()), ci=h.indexOf("分類"), ni=h.indexOf("商品名稱"), vi=h.indexOf("顯示"), oi=h.indexOf("排序");
 let map=new Map();
 rows.slice(1).forEach((r,idx)=>{
   let c=(r[ci]||"").trim(),n=(r[ni]||"").trim(),v=vi>=0?(r[vi]||"").trim():"是",o=oi>=0?Number(r[oi]||999999):idx;
   if(!c||!n||["否","不顯示","0","FALSE","false"].includes(v))return;
   if(!map.has(c))map.set(c,[]); map.get(c).push({name:n,order:o});
 });
 DATA=[...map].map(([name,items])=>({name,items:items.sort((a,b)=>a.order-b.order)}));
}
function drawTabs(){
 let cs=["全部",...DATA.map(s=>s.name)];
 document.getElementById("tabs").innerHTML=cs.map(c=>`<button class="tab ${c===cat?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
 document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cat=b.dataset.c;drawTabs();render()});
}
function render(){
 let term=document.getElementById("q").value.trim().toLowerCase(),out="",total=0;
 DATA.forEach(s=>{if(cat!=="全部"&&s.name!==cat)return;let items=s.items.filter(x=>x.name.toLowerCase().includes(term));if(!items.length)return;total+=items.length;out+=`<section class="sec"><h2>${esc(s.name)}</h2>${items.map(x=>`<div class="item">${esc(x.name)}</div>`).join("")}</section>`});
 document.getElementById("list").innerHTML=out||'<div class="msg">找不到符合的商品</div>';
 document.getElementById("count").textContent=`目前顯示 ${total} 個品項`;
}
async function load(){
 try{
   const r=await fetch(CSV_URL+"&_="+Date.now(),{cache:"no-store"}); if(!r.ok)throw Error();
   build(parseCSV(await r.text())); drawTabs(); render();
 }catch(e){document.getElementById("list").innerHTML='<div class="msg">目前無法讀取商品資料，請稍後重新整理。</div>';document.getElementById("count").textContent="";}
}
document.getElementById("q").addEventListener("input",render); load();
</script>
</body></html>
