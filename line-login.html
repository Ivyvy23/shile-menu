<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>食樂商行｜LINE 登入</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;margin:0;background:#fbf8f4;color:#2b241f}
.wrap{max-width:560px;margin:0 auto;padding:32px 20px}
.card{background:#fff;border:1px solid #eadfce;border-radius:18px;padding:24px;box-shadow:0 5px 18px #0000000d}
h1{font-size:24px;margin:0 0 12px;color:#7b1f2a}
p{line-height:1.7}
.status{background:#f5f5f5;border-radius:12px;padding:12px 14px;margin:16px 0;word-break:break-word}
button{width:100%;border:0;border-radius:12px;padding:13px 16px;font-size:17px;font-weight:700;background:#06c755;color:#fff}
.small{font-size:13px;color:#716861}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>食樂商行 LINE 登入</h1>
    <p>登入後即可讓本次訂單綁定 LINE，之後可接收訂單成立與出貨通知。</p>
    <div id="status" class="status">正在連接 LINE…</div>
    <button id="retryBtn" style="display:none">重新登入 LINE</button>
    <p class="small">登入成功後會自動返回商品目錄。</p>
  </div>
</div>

<script>
const LIFF_ID = "2012076583-CL3PR3P0";
const RETURN_URL = "https://lvyy23.github.io/shile-menu/";

async function finishLogin(){
  const status = document.getElementById("status");
  const retry = document.getElementById("retryBtn");

  try{
    await liff.init({ liffId: LIFF_ID });

    if(!liff.isLoggedIn()){
      status.textContent = "正在前往 LINE 登入…";
      liff.login();
      return;
    }

    const idToken = liff.getIDToken();
    if(!idToken){
      throw new Error("無法取得 LINE 登入憑證");
    }

    localStorage.setItem("shile_line_id_token", idToken);

    try{
      const profile = await liff.getProfile();
      if(profile && profile.displayName){
        localStorage.setItem("shile_line_display_name", profile.displayName);
      }
    }catch(e){}

    status.textContent = "LINE 登入成功，正在返回商品目錄…";
    setTimeout(()=>location.replace(RETURN_URL), 700);

  }catch(err){
    console.error(err);
    status.textContent = "LINE 登入失敗，請重新嘗試。";
    retry.style.display = "block";
  }
}

document.getElementById("retryBtn").onclick = ()=>{
  location.href = "https://liff.line.me/" + LIFF_ID;
};

finishLogin();
</script>
</body>
</html>
